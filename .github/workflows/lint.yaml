name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent folders
        env:
          PUBLIC_REPO: ${{ !github.event.repository.private }}
        run: ./scripts/lint.sh
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  no-personal-data:
    # Only meaningful for the public upstream repository: private forks commit rendered secrets.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private IPs, wildcard-DNS hosts, keys and tokens
        run: |
          if grep -rInE '(\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|sslip\.io|nip\.io|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' \
               --exclude-dir=.git --exclude=lint.yaml .; then
            echo "::error::Remove environment-specific or secret data (see matches above)."; exit 1
          fi
