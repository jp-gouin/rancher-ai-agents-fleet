name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agents
        run: |
          rc=0
          for f in suse/*.yaml third-party/*.yaml; do
            [ "$(basename "$f")" = fleet.yaml ] && continue
            name=$(basename "$f" .yaml); readme="$(dirname "$f")/README.md"
            if yq -e 'select(.kind == "Secret")' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::never commit Secrets: document them in $readme instead"; rc=1; continue
            fi
            yq -e '.kind == "AIAgentConfig" and .metadata.namespace == "cattle-ai-agent-system"' "$f" >/dev/null \
              || { echo "::error file=$f::must be an AIAgentConfig in cattle-ai-agent-system"; rc=1; continue; }
            [ "$(yq -r .metadata.name "$f")" = "$name" ] || { echo "::error file=$f::metadata.name must be '$name'"; rc=1; }
            grep -q "\`$name\`" "$readme" || { echo "::error file=$f::add a row for \`$name\` to $readme"; rc=1; }
            for s in $(yq -r '[.spec.authenticationSecret, .spec.caBundleRef.name] | map(select(. != null)) | .[]' "$f"); do
              grep -q "\`$s\`" "$readme" || { echo "::error file=$f::document Secret \`$s\` under Secrets in $readme"; rc=1; }
            done
          done
          exit $rc

  no-personal-data:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private IPs, wildcard-DNS hosts, keys and tokens
        run: |
          if grep -rInE '(\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|sslip\.io|nip\.io|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' \
               --exclude-dir=.git --exclude=lint.yaml .; then
            echo "::error::Remove environment-specific or secret data (see matches above)."; exit 1
          fi
