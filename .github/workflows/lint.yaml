name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent folders
        run: ./scripts/lint.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Dry-run render and secrets for every agent
        run: |
          set -euo pipefail
          # dummy values for every secret and every required variable
          for n in $(yq -r '[.secret.data, (.extraSecrets // [])[].data] | map(select(. != null) | to_entries[] | .value) | .[]' suse/*/agent.yaml third-party/*/agent.yaml | sort -u); do export "$n=dummy"; done
          for n in $(grep -ohE '\$\{[A-Z0-9_]+\}' suse/*/aiagentconfig.yaml third-party/*/aiagentconfig.yaml | tr -d '${}' | sort -u); do export "$n=https://example.com"; done
          export KUBECONFIG=/dev/null AGENTS=all DRY_RUN=true
          ./scripts/deploy.sh secrets > /dev/null
          ./scripts/deploy.sh render "$RUNNER_TEMP/rendered"
          REPO_URL=https://github.com/example/fork ./scripts/deploy.sh gitrepo > /dev/null

  no-personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private IPs, wildcard-DNS hosts, keys and tokens
        run: |
          if grep -rInE '(\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|sslip\.io|nip\.io|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' \
               --exclude-dir=.git --exclude=lint.yaml .; then
            echo "::error::Remove environment-specific or secret data (see matches above)."; exit 1
          fi
