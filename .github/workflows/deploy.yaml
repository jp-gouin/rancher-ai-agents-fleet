name: Deploy AI agents

# workflow_dispatch: create the agent Secrets, render the manifests to the
#                    `fleet` branch and register that branch as a Fleet GitRepo.
# push to main:      re-render the `fleet` branch only (no cluster access needed);
#                    Fleet picks the change up by itself.
on:
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to deploy (comma separated or 'all'). Empty = AGENTS variable"
        required: false
      dry_run:
        description: "Print the manifests (secrets redacted) without touching the cluster or the fleet branch"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["suse/**", "third-party/**", "scripts/deploy.sh"]

permissions:
  contents: write   # push the rendered `fleet` branch

concurrency:
  group: deploy-ai-agents
  cancel-in-progress: false

env:
  AGENTS: ${{ inputs.agents || vars.AGENTS }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  FLEET_BRANCH: ${{ vars.FLEET_BRANCH || 'fleet' }}
  GITREPO_NAME: ${{ vars.GITREPO_NAME || 'rancher-ai-agents' }}
  VARS_JSON: ${{ toJSON(vars) }}
  CLUSTER_STEPS: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}

jobs:
  deploy:
    # Use a self-hosted runner (vars.RUNNER) when the Rancher API is not reachable from GitHub.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          HAS_KUBECONFIG: ${{ secrets.RANCHER_KUBECONFIG != '' }}
        run: |
          if [ -z "$AGENTS" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::notice::AGENTS is not set: nothing to render. See README > Quick start."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Set the AGENTS repository variable (e.g. 'appco,github' or 'all'). See README > Quick start."; exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$CLUSTER_STEPS" = "true" ] && [ "$HAS_KUBECONFIG" != "true" ]; then
            echo "::error::Set the RANCHER_KUBECONFIG secret. See README > Quick start."; exit 1
          fi

      - name: Write kubeconfig
        if: env.CLUSTER_STEPS == 'true'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.RANCHER_KUBECONFIG }}
        run: |
          umask 077
          if printf '%s' "$KUBECONFIG_CONTENT" | grep -q 'apiVersion'; then
            printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          else
            printf '%s' "$KUBECONFIG_CONTENT" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          fi
          KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl get --raw /version >/dev/null && echo "Cluster reachable"

      - name: Create agent secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          # Secrets must be listed one by one: GitHub holds runs that use
          # toJSON(secrets) for manual approval. Lint fails if a secret named in
          # an agent.yaml is missing here.
          # --- agent secrets (keep sorted) ---
          APPCO_PASSWORD: ${{ secrets.APPCO_PASSWORD }}
          APPCO_USERNAME: ${{ secrets.APPCO_USERNAME }}
          ARGOCD_MCP_AUTH_HEADER: ${{ secrets.ARGOCD_MCP_AUTH_HEADER }}
          GH_MCP_TOKEN: ${{ secrets.GH_MCP_TOKEN }}
          GH_MCP_TOOLSETS: ${{ secrets.GH_MCP_TOOLSETS }}
          OVH_CLIENT_ID: ${{ secrets.OVH_CLIENT_ID }}
          OVH_CLIENT_SECRET: ${{ secrets.OVH_CLIENT_SECRET }}
          OVH_OAUTH_METADATA_ENDPOINT: ${{ secrets.OVH_OAUTH_METADATA_ENDPOINT }}
          ROVO_API_TOKEN: ${{ secrets.ROVO_API_TOKEN }}
          ROVO_USERNAME: ${{ secrets.ROVO_USERNAME }}
          SBOMSCANNER_MCP_PASSWORD: ${{ secrets.SBOMSCANNER_MCP_PASSWORD }}
          SBOMSCANNER_MCP_USERNAME: ${{ secrets.SBOMSCANNER_MCP_USERNAME }}
        run: ./scripts/deploy.sh secrets

      - name: Render manifests
        if: steps.check.outputs.skip != 'true'
        run: ./scripts/deploy.sh render "$RUNNER_TEMP/rendered"

      - name: Show rendered manifests
        if: env.DRY_RUN == 'true'
        run: find "$RUNNER_TEMP/rendered" -name '*.yaml' -print -exec cat {} \;

      - name: Publish the fleet branch
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/rendered"
          cat > README.md <<MD
          # Rendered manifests - do not edit
          Generated by the *Deploy AI agents* workflow from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.
          Edit the templates on the default branch instead. Fleet watches this branch.
          MD
          git init -q -b "$FLEET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Render ${GITHUB_SHA::7} (agents: ${AGENTS})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${FLEET_BRANCH}"
          echo "Published branch ${FLEET_BRANCH}"

      - name: Register the Fleet GitRepo
        if: github.event_name == 'workflow_dispatch'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          REPO_URL: ${{ vars.FLEET_REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
          FLEET_GIT_TOKEN: ${{ secrets.FLEET_GIT_TOKEN }}
        run: ./scripts/deploy.sh gitrepo

      - name: Show status
        if: env.CLUSTER_STEPS == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          sleep 20
          kubectl get gitrepo -n fleet-local "$GITREPO_NAME" -o wide || true
          kubectl get aiagentconfig -n cattle-ai-agent-system || true
