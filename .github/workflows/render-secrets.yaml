name: Render agent secrets

# Fills every <folder>/<agent>.secret.yaml.tpl from the repository's GitHub
# variables and commits <agent>.secret.yaml next to it. Fleet deploys it from
# there; this workflow never talks to the cluster.
#   ${NAME}           required (agents with a missing required variable are skipped)
#   ${NAME:-default}  optional
# Rendered files hold credentials in plain text: the workflow refuses to run in
# a public repository.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**/*.secret.yaml.tpl"]

permissions:
  contents: write

concurrency:
  group: render-agent-secrets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run in a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::Public repository: secrets are not rendered. Use a private copy (see README)."; exit 0
          fi
          echo "::error::This repository is public. Rendered secrets would be published. Use a private copy (see README)."
          exit 1

      - uses: actions/checkout@v4
        if: github.event.repository.private

      - name: Render secrets
        if: github.event.repository.private
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          for tpl in */*.secret.yaml.tpl; do
            # Comment lines are dropped; a value containing ${...} is rendered and
            # written as a quoted string, so special characters and PEM data are safe.
            if perl -MJSON::PP -e '
                my $vars = decode_json($ENV{VARS_JSON}); my @missing;
                my $json = JSON::PP->new->ascii->allow_nonref;
                sub val { my ($n, $d) = @_; my $v = $vars->{$n};
                  return $v if defined $v && $v ne ""; return $d if defined $d;
                  push @missing, $n; return "" }
                my $out = "# Generated from the .tpl file by the Render agent secrets workflow. Do not edit.\n";
                while (my $l = <>) {
                  next if $l =~ /^\s*#/;
                  if ($l =~ /^(\s*[^\s:#][^:]*:\s+)(.*\$\{.*?)\s*$/) {
                    my ($k, $e) = ($1, $2);
                    $e =~ s/\$\{([A-Z0-9_]+)(?::-([^\}]*))?\}/val($1, $2)/ge;
                    $l = $k . $json->encode($e) . "\n";
                  }
                  $out .= $l;
                }
                if (@missing) { print STDERR "skipped  $ARGV (missing: @missing)\n"; exit 1 }
                print $out;
              ' "$tpl" > "$tpl.out"; then
              mv "$tpl.out" "${tpl%.tpl}"; echo "rendered ${tpl%.tpl}"
            else
              rm -f "$tpl.out"
            fi
          done

      - name: Commit
        if: github.event.repository.private
        run: |
          git add -A -- '*/*.secret.yaml'
          if git diff --cached --quiet; then echo "No secret changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render agent secrets from GitHub variables"
          git push
