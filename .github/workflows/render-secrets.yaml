name: Render agent secrets

# Renders every <category>/<agent>.secret.yaml.tpl into <agent>.secret.yaml from the
# repository's GitHub variables and commits the result to the current branch.
# Fleet deploys it from there: this workflow never talks to the cluster.
#
# The rendered *.secret.yaml files hold credentials in plain text, so this
# workflow refuses to run in a public repository.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**/*.secret.yaml.tpl", "scripts/render-secrets.sh"]

permissions:
  contents: write

concurrency:
  group: render-agent-secrets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run in a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::Public repository: secrets are not rendered. Use a private fork (see README)."
            exit 0
          fi
          echo "::error::This repository is public. Rendered secrets would be published. Use a private copy (see README > Quick start)."
          exit 1

      - uses: actions/checkout@v4
        if: github.event.repository.private

      - name: Render secrets
        if: github.event.repository.private
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: ./scripts/render-secrets.sh

      - name: Commit
        if: github.event.repository.private
        run: |
          git add -A -- 'suse/*.secret.yaml' 'third-party/*.secret.yaml'
          if git diff --cached --quiet; then
            echo "No secret changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render agent secrets from GitHub variables"
          git push
