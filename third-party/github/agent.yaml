# Secrets the deploy workflow creates in cattle-ai-agent-system before Fleet
# applies aiagentconfig.yaml. Only GitHub secret NAMES live here, never values.
# GitHub secret names cannot start with GITHUB_, hence the GH_ prefix.
name: github
secret:
  name: ai-agent-github-auth           # = spec.authenticationSecret
  type: Opaque
  data:                                # <secret key>: <GitHub secret name>
    # HEADER auth: every key is sent as an HTTP header to the MCP server.
    # Stored verbatim: the value must be "Bearer <PAT>", not just the token.
    Authorization: GH_MCP_TOKEN
    X-MCP-Toolsets: GH_MCP_TOOLSETS
  defaults:                            # <secret key>: <literal> (used when the GitHub secret is unset)
    # GitHub's default toolsets plus "actions" (workflow runs and logs).
    X-MCP-Toolsets: context,repos,issues,pull_requests,users,actions
