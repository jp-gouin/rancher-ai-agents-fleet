# Secrets the deploy workflow creates in cattle-ai-agent-system before Fleet
# applies aiagentconfig.yaml. Only GitHub secret NAMES live here, never values.
name: rovo
secret:
  name: ai-agent-rovo-auth             # = spec.authenticationSecret
  type: kubernetes.io/basic-auth
  data:                                # <secret key>: <GitHub secret name>
    username: ROVO_USERNAME            # Atlassian account email
    password: ROVO_API_TOKEN           # Atlassian API token (Rovo MCP scopes)
