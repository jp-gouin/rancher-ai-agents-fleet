# Fleet GitRepo for your PRIVATE copy. Apply it on the Rancher local cluster, or
# create the same thing in Rancher > Continuous Delivery > Git Repos (workspace
# fleet-local). Each path is one bundle; drop the one you don't need.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: rancher-ai-agents
  namespace: fleet-local          # Rancher AI agents live on the local cluster
spec:
  repo: https://github.com/<you>/<your-private-copy>
  branch: main
  # basic-auth Secret in fleet-local: username + read-only token (Contents: read)
  clientSecretName: rancher-ai-agents-git-auth
  paths:
    - suse
    - third-party
