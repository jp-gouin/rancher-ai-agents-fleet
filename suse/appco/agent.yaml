# Secrets the deploy workflow creates in cattle-ai-agent-system before Fleet
# applies aiagentconfig.yaml. Only GitHub secret NAMES live here, never values.
name: appco
secret:
  name: ai-agent-appco-auth            # = spec.authenticationSecret
  type: kubernetes.io/basic-auth
  data:                                # <secret key>: <GitHub secret name>
    username: APPCO_USERNAME
    password: APPCO_PASSWORD
